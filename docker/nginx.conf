worker_processes auto;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  upstream app_cluster {
    # Docker's internal DNS resolves "app" to all replica IPs via round-robin.
    # Each new connection is distributed across the 4 NestJS instances.
    server app:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass         http://app_cluster;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    # Pass /health directly so load balancer can check app readiness
    location /health {
      proxy_pass http://app_cluster/health;
    }
  }
}
